<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Night Garden - Live Cinematic Experience</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep-night: #030712;
            --bg-indigo-sky: #090d26;
            --bg-horizon-purple: #161032;
            --moon-glow-color: rgba(186, 215, 255, 0.45);
            --flower-gold: #fbbf24;
            --flower-warm: #f59e0b;
            --flower-orange: #f97316;
            --ui-glass-bg: rgba(15, 23, 42, 0.65);
            --ui-glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep-night);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            animation: cameraBreathing 18s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes cameraBreathing {
            0% { transform: scale(1.0) translate(0px, 0px); }
            50% { transform: scale(1.015) translate(-4px, -3px); }
            100% { transform: scale(1.008) translate(3px, -5px); }
        }

        /* Layer positioning */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sky-container {
            background: radial-gradient(circle at 75% 25%, #182854 0%, var(--bg-indigo-sky) 45%, var(--bg-horizon-purple) 75%, var(--bg-deep-night) 100%);
            z-index: 1;
        }

        /* Moon styling */
        .moon-wrapper {
            position: absolute;
            top: 12%;
            right: 18%;
            width: 180px;
            height: 180px;
            z-index: 2;
            filter: drop-shadow(0 0 35px var(--moon-glow-color)) drop-shadow(0 0 75px rgba(147, 197, 253, 0.25));
            animation: moonPulse 8s ease-in-out infinite alternate;
        }

        @keyframes moonPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 30px var(--moon-glow-color)) drop-shadow(0 0 60px rgba(147, 197, 253, 0.2)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 50px rgba(219, 234, 254, 0.65)) drop-shadow(0 0 100px rgba(147, 197, 253, 0.4)); }
        }

        .crescent-moon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: inset -28px 12px 0 0 #f8fafc, inset -32px 14px 10px 0 rgba(226, 232, 240, 0.8);
            position: relative;
            transform: rotate(-15deg);
        }

        /* Subtle crater details inside moon */
        .moon-crater {
            position: absolute;
            background: rgba(148, 163, 184, 0.18);
            border-radius: 50%;
        }
        .crater-1 { width: 18px; height: 18px; top: 40px; right: 28px; }
        .crater-2 { width: 12px; height: 12px; top: 75px; right: 22px; }
        .crater-3 { width: 22px; height: 22px; top: 105px; right: 38px; }

        .cloud-layer {
            z-index: 3;
            opacity: 0.45;
        }

        .cloud {
            position: absolute;
            background: radial-gradient(ellipse at center, rgba(147, 197, 253, 0.25) 0%, rgba(30, 41, 59, 0.05) 70%, transparent 100%);
            border-radius: 50%;
            filter: blur(20px);
            animation: cloudDrift linear infinite;
        }

        @keyframes cloudDrift {
            0% { transform: translateX(-20vw); }
            100% { transform: translateX(120vw); }
        }

        /* Canvases for stars, garden, and fireflies */
        #skyCanvas { z-index: 2; }
        #gardenCanvas { z-index: 5; pointer-events: auto; cursor: pointer; }
        #particleCanvas { z-index: 6; }

        .fog-container {
            z-index: 4;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.7) 0%, rgba(30, 41, 59, 0.2) 30%, transparent 70%);
            mix-blend-mode: screen;
            opacity: 0.6;
            animation: fogSway 25s ease-in-out infinite alternate;
        }

        @keyframes fogSway {
            0% { transform: translateY(0px) scaleY(1); opacity: 0.5; }
            50% { transform: translateY(-15px) scaleY(1.05); opacity: 0.7; }
            100% { transform: translateY(-5px) scaleY(0.98); opacity: 0.55; }
        }

        .ui-header {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 10;
            pointer-events: none;
        }

        .title-main {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            letter-spacing: 0.1em;
            margin-top: 4px;
            font-weight: 300;
        }

        /* Control Panel Glassmorphism Card */
        .ui-controls {
            position: absolute;
            bottom: 28px;
            right: 28px;
            z-index: 10;
            background: var(--ui-glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--ui-glass-border);
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ui-controls.minimized {
            transform: translateY(calc(100% + 40px));
            opacity: 0;
            pointer-events: none;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            outline: none;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }

        .control-btn.active {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.3) 0%, rgba(245, 158, 11, 0.2) 100%);
            border-color: rgba(251, 191, 36, 0.5);
            color: #fef08a;
        }

        .stats-badge {
            font-size: 0.78rem;
            color: #cbd5e1;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-ui-btn {
            position: absolute;
            bottom: 28px;
            right: 28px;
            z-index: 11;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--ui-glass-bg);
            border: 1px solid var(--ui-glass-border);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .toggle-ui-btn:hover {
            scale: 1.08;
            background: rgba(30, 41, 59, 0.9);
        }

        /* Interactive Hint Toast */
        .interactive-toast {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #94a3b8;
            pointer-events: none;
            animation: pulseHint 3s infinite ease-in-out;
            letter-spacing: 0.05em;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) translateY(0); }
            50% { opacity: 0.95; transform: translateX(-50%) translateY(-3px); }
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            #viewport, .moon-wrapper, .fog-container, .cloud {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <!-- Sky Background Layer -->
        <div class="layer sky-container"></div>
        
        <!-- Stars & Shooting Stars Canvas -->
        <canvas id="skyCanvas" class="layer"></canvas>

        <!-- Moon Element with Crater Details -->
        <div class="moon-wrapper">
            <div class="crescent-moon">
                <div class="moon-crater crater-1"></div>
                <div class="moon-crater crater-2"></div>
                <div class="moon-crater crater-3"></div>
            </div>
        </div>

        <!-- Drifting Atmospheric Cloud Layer -->
        <div id="cloudLayer" class="layer cloud-layer"></div>

        <!-- Dynamic Fog Overlay -->
        <div class="layer fog-container"></div>

        <!-- Main Garden Layer (Hills, Grass Blades, Glowing Flowers) -->
        <canvas id="gardenCanvas" class="layer"></canvas>

        <!-- Ambient Particle & Firefly Canvas -->
        <canvas id="particleCanvas" class="layer"></canvas>

        <!-- UI Header -->
        <div class="ui-header">
            <h1 class="title-main">NIGHT GARDEN</h1>
            <p class="subtitle">A CINEMATIC MAGICAL SANCTUARY</p>
        </div>

        <!-- Interactive Hint Toast -->
        <div class="interactive-toast" id="interactiveToast">
            ✨ Click on the meadow to bloom new magical flowers
        </div>

        <!-- Control Toggle Button (For immersive viewing) -->
        <button class="toggle-ui-btn" id="toggleUiBtn" title="Toggle Controls">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>

        <!-- Glassmorphism Controls Panel -->
        <div class="ui-controls" id="controlsPanel">
            <button class="control-btn" id="audioToggleBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <span>Soundscape: Off</span>
            </button>

            <button class="control-btn" id="windToggleBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
                </svg>
                <span>Breeze: Gentle</span>
            </button>

            <div class="stats-badge" id="flowerCounterBadge">
                Flowers: <span id="flowerCountVal" style="color: #fbbf24; font-weight: 600;">0</span>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Screen dimensions and setup
            const skyCanvas = document.getElementById('skyCanvas');
            const skyCtx = skyCanvas.getContext('2d');
            const gardenCanvas = document.getElementById('gardenCanvas');
            const gardenCtx = gardenCanvas.getContext('2d');
            const particleCanvas = document.getElementById('particleCanvas');
            const particleCtx = particleCanvas.getContext('2d');

            let width = window.innerWidth;
            let height = window.innerHeight;

            // Global simulation options
            const CONFIG = {
                starCount: 420,
                targetFlowerCount: 55,
                fireflyCount: 45,
                particleCount: 70,
                windStrength: 1.0,
                timeSpeed: 0.001
            };

            // Audio Web API Soundscape state
            let audioCtx = null;
            let audioGain = null;
            let isAudioPlaying = false;

            function resizeCanvases() {
                width = window.innerWidth;
                height = window.innerHeight;
                
                [skyCanvas, gardenCanvas, particleCanvas].forEach(canvas => {
                    canvas.width = width;
                    canvas.height = height;
                });

                // Re-calculate ground curves
                initGroundCurves();
            }

            // Window resize event listener
            window.addEventListener('resize', resizeCanvases);

            function initClouds() {
                const cloudLayer = document.getElementById('cloudLayer');
                cloudLayer.innerHTML = '';
                const cloudCounts = 6;

                for (let i = 0; i < cloudCounts; i++) {
                    const cloud = document.createElement('div');
                    cloud.className = 'cloud';
                    const w = Math.random() * 300 + 350;
                    const h = Math.random() * 100 + 120;
                    cloud.style.width = `${w}px`;
                    cloud.style.height = `${h}px`;
                    cloud.style.top = `${Math.random() * 45}%`;
                    cloud.style.left = `${-300 - Math.random() * 400}px`;
                    cloud.style.animationDuration = `${Math.random() * 60 + 80}s`;
                    cloud.style.animationDelay = `${Math.random() * -80}s`;
                    cloudLayer.appendChild(cloud);
                }
            }

            class Star {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * (height * 0.75);
                    this.size = Math.random() * 1.8 + 0.4;
                    this.baseAlpha = Math.random() * 0.7 + 0.3;
                    this.alpha = this.baseAlpha;
                    this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                    this.twinklePhase = Math.random() * Math.PI * 2;
                    this.color = Math.random() > 0.85 ? '#e0f2fe' : (Math.random() > 0.7 ? '#fef3c7' : '#ffffff');
                }

                update(time) {
                    this.alpha = this.baseAlpha + Math.sin(time * this.twinkleSpeed + this.twinklePhase) * 0.35;
                    if (this.alpha < 0.05) this.alpha = 0.05;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();

                    // Subtle radial bloom for larger stars
                    if (this.size > 1.3) {
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = this.color;
                    }
                    ctx.restore();
                }
            }

            class ShootingStar {
                constructor() {
                    this.active = false;
                }

                spawn() {
                    this.x = Math.random() * width * 0.8 + width * 0.1;
                    this.y = Math.random() * height * 0.3;
                    this.length = Math.random() * 80 + 60;
                    this.speed = Math.random() * 10 + 12;
                    this.angle = (Math.PI / 180) * (Math.random() * 25 + 25); // Slanted downwards
                    this.dx = Math.cos(this.angle) * this.speed;
                    this.dy = Math.sin(this.angle) * this.speed;
                    this.opacity = 1.0;
                    this.active = true;
                }

                update() {
                    if (!this.active) return;
                    this.x += this.dx;
                    this.y += this.dy;
                    this.opacity -= 0.018;

                    if (this.opacity <= 0 || this.x > width || this.y > height) {
                        this.active = false;
                    }
                }

                draw(ctx) {
                    if (!this.active) return;
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    
                    const tailX = this.x - Math.cos(this.angle) * this.length;
                    const tailY = this.y - Math.sin(this.angle) * this.length;

                    const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    grad.addColorStop(0.3, 'rgba(186, 230, 253, 0.6)');
                    grad.addColorStop(1, 'rgba(186, 230, 253, 0)');

                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.8;
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();

                    ctx.restore();
                }
            }

            const stars = Array.from({ length: CONFIG.starCount }, () => new Star());
            const shootingStar = new ShootingStar();

            let groundHills = [];

            function initGroundCurves() {
                groundHills = [
                    {
                        // Background distant hill
                        yOffset: height * 0.68,
                        colorStart: '#081222',
                        colorEnd: '#020617',
                        amplitude: 35,
                        frequency: 0.002,
                        phase: 0
                    },
                    {
                        // Midground hill
                        yOffset: height * 0.74,
                        colorStart: '#0b1d28',
                        colorEnd: '#030a12',
                        amplitude: 25,
                        frequency: 0.003,
                        phase: 2
                    },
                    {
                        // Foreground main meadow hill
                        yOffset: height * 0.82,
                        colorStart: '#0f2922',
                        colorEnd: '#020c09',
                        amplitude: 20,
                        frequency: 0.0025,
                        phase: 4
                    }
                ];
            }

            function getGroundY(x, hillIndex = 2) {
                const hill = groundHills[hillIndex];
                if (!hill) return height * 0.8;
                return hill.yOffset + Math.sin(x * hill.frequency + hill.phase) * hill.amplitude;
            }

            class GrassBlade {
                constructor(x, y, layerIndex) {
                    this.x = x;
                    this.y = y;
                    this.layerIndex = layerIndex;
                    this.height = Math.random() * 45 + 30;
                    this.width = Math.random() * 2.5 + 2.0;
                    this.maxSway = Math.random() * 18 + 12;
                    this.swaySpeed = Math.random() * 0.03 + 0.015;
                    this.phase = Math.random() * Math.PI * 2;
                    
                    // Realistic moonlight grass shade colors
                    const greens = [
                        '#0f382c', '#134e3a', '#0a2e23', '#165b44', '#08251c'
                    ];
                    this.color = greens[Math.floor(Math.random() * greens.length)];
                }

                draw(ctx, time, windFactor) {
                    const sway = Math.sin(time * this.swaySpeed + this.phase) * this.maxSway * windFactor;
                    const tipX = this.x + sway;
                    const tipY = this.y - this.height;

                    const controlX = this.x + sway * 0.4;
                    const controlY = this.y - this.height * 0.5;

                    ctx.save();
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.width / 2, this.y);
                    ctx.quadraticCurveTo(controlX, controlY, tipX, tipY);
                    ctx.quadraticCurveTo(controlX + this.width / 2, controlY, this.x + this.width / 2, this.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            }

            let grassBlades = [];

            function generateGrass() {
                grassBlades = [];
                const bladeDensity = Math.floor(width / 2.2); // Hundreds of individual blades

                for (let i = 0; i < bladeDensity; i++) {
                    const x = Math.random() * width;
                    const y = getGroundY(x, 2) + Math.random() * 15;
                    grassBlades.push(new GrassBlade(x, y, 2));
                }
                
                // Sort grass by Y for proper perspective layering
                grassBlades.sort((a, b) => a.y - b.y);
            }

            class Flower {
                constructor(x, y, delay = 0) {
                    this.x = x;
                    this.groundY = y;
                    this.maxHeight = Math.random() * 80 + 70;
                    this.currentHeight = 0;
                    this.growthProgress = 0; // 0 to 1
                    this.growthSpeed = 0.006 + Math.random() * 0.004;
                    this.delay = delay;
                    this.age = 0;

                    // Petal colors: Golden Yellow, Warm Yellow, Light Orange
                    const colors = [
                        { inner: '#fef08a', outer: '#fbbf24', glow: 'rgba(251, 191, 36, 0.6)' },
                        { inner: '#fef3c7', outer: '#f59e0b', glow: 'rgba(245, 158, 11, 0.6)' },
                        { inner: '#ffedd5', outer: '#f97316', glow: 'rgba(249, 115, 22, 0.6)' }
                    ];
                    this.colorScheme = colors[Math.floor(Math.random() * colors.length)];

                    this.petalCount = Math.floor(Math.random() * 3) + 5; // 5 to 7 petals
                    this.flowerRadius = Math.random() * 8 + 14;
                    this.swayPhase = Math.random() * Math.PI * 2;
                    this.swaySpeed = Math.random() * 0.02 + 0.01;
                    this.glowPulsePhase = Math.random() * Math.PI * 2;
                }

                update(time) {
                    if (this.delay > 0) {
                        this.delay--;
                        return;
                    }

                    if (this.growthProgress < 1) {
                        this.growthProgress += this.growthSpeed;
                        if (this.growthProgress > 1) this.growthProgress = 1;
                        this.currentHeight = this.maxHeight * this.easeInOutCubic(this.growthProgress);
                    }

                    this.age += 0.02;
                }

                easeInOutCubic(x) {
                    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
                }

                draw(ctx, time, windFactor) {
                    if (this.delay > 0 || this.currentHeight <= 2) return;

                    // Rooted stem with head sway
                    const sway = Math.sin(time * this.swaySpeed + this.swayPhase) * (15 * windFactor);
                    const headX = this.x + sway * (this.currentHeight / this.maxHeight);
                    const headY = this.groundY - this.currentHeight;

                    const controlX = this.x + sway * 0.3;
                    const controlY = this.groundY - this.currentHeight * 0.5;

                    ctx.save();

                    // 1. Draw Stem
                    ctx.strokeStyle = '#15803d';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.groundY);
                    ctx.quadraticCurveTo(controlX, controlY, headX, headY);
                    ctx.stroke();

                    // 2. Draw Leaves if stem has grown enough
                    if (this.growthProgress > 0.3) {
                        const leafScale = Math.min(1, (this.growthProgress - 0.3) / 0.4);
                        const leafY = this.groundY - this.currentHeight * 0.35;
                        const leafX = this.x + sway * 0.35;

                        ctx.fillStyle = '#166534';
                        
                        // Left leaf
                        ctx.beginPath();
                        ctx.ellipse(leafX - 10 * leafScale, leafY, 12 * leafScale, 5 * leafScale, -Math.PI / 6, 0, Math.PI * 2);
                        ctx.fill();

                        // Right leaf
                        ctx.beginPath();
                        ctx.ellipse(leafX + 10 * leafScale, leafY - 4, 12 * leafScale, 5 * leafScale, Math.PI / 6, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 3. Blooming Flower Head
                    if (this.growthProgress > 0.5) {
                        const bloomScale = (this.growthProgress - 0.5) / 0.5;
                        const pulseGlow = Math.sin(time * 0.03 + this.glowPulsePhase) * 0.25 + 0.75;

                        ctx.translate(headX, headY);

                        // Radial Bloom Glow Aura
                        const auraGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.flowerRadius * 3 * bloomScale);
                        auraGrad.addColorStop(0, this.colorScheme.glow);
                        auraGrad.addColorStop(0.5, this.colorScheme.glow.replace('0.6', '0.25'));
                        auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.fillStyle = auraGrad;
                        ctx.globalCompositeOperation = 'screen';
                        ctx.beginPath();
                        ctx.arc(0, 0, this.flowerRadius * 3 * bloomScale * pulseGlow, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';

                        // Petals
                        const angleStep = (Math.PI * 2) / this.petalCount;
                        ctx.fillStyle = this.colorScheme.outer;

                        for (let i = 0; i < this.petalCount; i++) {
                            const angle = i * angleStep + Math.sin(this.age) * 0.05;
                            ctx.save();
                            ctx.rotate(angle);

                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.quadraticCurveTo(
                                this.flowerRadius * 0.8 * bloomScale,
                                -this.flowerRadius * 0.8 * bloomScale,
                                0,
                                -this.flowerRadius * 1.5 * bloomScale
                            );
                            ctx.quadraticCurveTo(
                                -this.flowerRadius * 0.8 * bloomScale,
                                -this.flowerRadius * 0.8 * bloomScale,
                                0,
                                0
                            );
                            ctx.fill();
                            ctx.restore();
                        }

                        // Flower Center
                        ctx.fillStyle = this.colorScheme.inner;
                        ctx.shadowBlur = 12 * pulseGlow;
                        ctx.shadowColor = this.colorScheme.outer;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.flowerRadius * 0.45 * bloomScale, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            let flowers = [];

            function generateInitialFlowers() {
                flowers = [];
                for (let i = 0; i < CONFIG.targetFlowerCount; i++) {
                    const x = Math.random() * (width - 100) + 50;
                    const y = getGroundY(x, 2) + Math.random() * 10;
                    const delay = Math.floor(i * 12 + Math.random() * 20); // Staggered sequential bloom
                    flowers.push(new Flower(x, y, delay));
                }
                updateFlowerCounter();
            }

            function addInteractiveFlower(x, y) {
                // Ensure y is rooted near the ground curve
                const groundY = getGroundY(x, 2) + 5;
                const newFlower = new Flower(x, groundY, 0); // Sprout immediately
                flowers.push(newFlower);
                updateFlowerCounter();
                
                // Play gentle bloom sound effect if audio is on
                playBloomSound();
            }

            function updateFlowerCounter() {
                const countVal = document.getElementById('flowerCountVal');
                if (countVal) countVal.innerText = flowers.length;
            }

            class Firefly {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = getGroundY(this.x, 2) - Math.random() * 200 - 30;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.6;
                    this.size = Math.random() * 2.2 + 1.2;
                    this.alpha = Math.random();
                    this.pulseSpeed = Math.random() * 0.04 + 0.02;
                    this.targetFlower = null;
                }

                update(time) {
                    // Organic floating wander vector
                    this.vx += (Math.random() - 0.5) * 0.12;
                    this.vy += (Math.random() - 0.5) * 0.1;

                    // Speed limit
                    const speed = Math.hypot(this.vx, this.vy);
                    if (speed > 1.2) {
                        this.vx = (this.vx / speed) * 1.2;
                        this.vy = (this.vy / speed) * 1.2;
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    // Keep fireflies bounded near flowers meadow
                    const groundLevel = getGroundY(this.x, 2);
                    if (this.y > groundLevel + 10 || this.y < groundLevel - 350 || this.x < 0 || this.x > width) {
                        this.reset();
                    }

                    this.alpha = (Math.sin(time * this.pulseSpeed) + 1) / 2;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'screen';
                    
                    const radGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                    radGrad.addColorStop(0, `rgba(254, 240, 138, ${this.alpha})`);
                    radGrad.addColorStop(0.4, `rgba(251, 191, 36, ${this.alpha * 0.5})`);
                    radGrad.addColorStop(1, 'rgba(0,0,0,0)');

                    ctx.fillStyle = radGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            class PollenParticle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = height * 0.5 + Math.random() * (height * 0.5);
                    this.size = Math.random() * 1.2 + 0.5;
                    this.speedY = -(Math.random() * 0.3 + 0.1);
                    this.speedX = (Math.random() - 0.5) * 0.2;
                    this.alpha = Math.random() * 0.5 + 0.2;
                }

                update() {
                    this.y += this.speedY;
                    this.x += this.speedX;

                    if (this.y < height * 0.2 || this.x < 0 || this.x > width) {
                        this.reset();
                    }
                }

                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = 'rgba(224, 242, 254, 0.7)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            const fireflies = Array.from({ length: CONFIG.fireflyCount }, () => new Firefly());
            const pollenParticles = Array.from({ length: CONFIG.particleCount }, () => new PollenParticle());

            function initAudio() {
                if (audioCtx) return;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                audioGain = audioCtx.createGain();
                audioGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                audioGain.connect(audioCtx.destination);

                // Deep atmospheric ambient night pad
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(110, audioCtx.currentTime); // A2
                osc2.frequency.setValueAtTime(164.81, audioCtx.currentTime); // E3

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, audioCtx.currentTime);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(audioGain);

                osc1.start();
                osc2.start();
            }

            function playBloomSound() {
                if (!audioCtx || !isAudioPlaying) return;

                const chimeOsc = audioCtx.createOscillator();
                const chimeGain = audioCtx.createGain();

                chimeOsc.type = 'sine';
                // E-major pentatonic chime tones
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                const freq = freqs[Math.floor(Math.random() * freqs.length)];

                chimeOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                chimeGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                chimeGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

                chimeOsc.connect(chimeGain);
                chimeGain.connect(audioGain);

                chimeOsc.start();
                chimeOsc.stop(audioCtx.currentTime + 1.8);
            }

            const audioBtn = document.getElementById('audioToggleBtn');
            const windBtn = document.getElementById('windToggleBtn');
            const toggleUiBtn = document.getElementById('toggleUiBtn');
            const controlsPanel = document.getElementById('controlsPanel');
            const interactiveToast = document.getElementById('interactiveToast');

            audioBtn.addEventListener('click', () => {
                if (!audioCtx) initAudio();

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                isAudioPlaying = !isAudioPlaying;

                if (isAudioPlaying) {
                    audioGain.gain.setTargetAtTime(0.18, audioCtx.currentTime, 0.5);
                    audioBtn.classList.add('active');
                    audioBtn.querySelector('span').innerText = 'Soundscape: On';
                } else {
                    audioGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
                    audioBtn.classList.remove('active');
                    audioBtn.querySelector('span').innerText = 'Soundscape: Off';
                }
            });

            const windStates = [
                { label: 'Breeze: Calm', factor: 0.4 },
                { label: 'Breeze: Gentle', factor: 1.0 },
                { label: 'Breeze: Gusty', factor: 2.2 }
            ];
            let windStateIdx = 1;

            windBtn.addEventListener('click', () => {
                windStateIdx = (windStateIdx + 1) % windStates.length;
                CONFIG.windStrength = windStates[windStateIdx].factor;
                windBtn.querySelector('span').innerText = windStates[windStateIdx].label;
            });

            toggleUiBtn.addEventListener('click', () => {
                controlsPanel.classList.toggle('minimized');
            });

            // Click on meadow to bloom new flower
            gardenCanvas.addEventListener('click', (e) => {
                const rect = gardenCanvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                // Sprout new flower
                addInteractiveFlower(clickX, clickY);

                // Fade hint toast after user interacts
                if (interactiveToast) {
                    interactiveToast.style.opacity = '0';
                    setTimeout(() => interactiveToast.remove(), 1000);
                }
            });

            let animationFrameId = null;
            let tick = 0;

            function renderScene(timestamp) {
                tick += 1;

                // 1. CLEAR CANVASES
                skyCtx.clearRect(0, 0, width, height);
                gardenCtx.clearRect(0, 0, width, height);
                particleCtx.clearRect(0, 0, width, height);

                // 2. RENDER SKY (Stars & Shooting Stars)
                stars.forEach(star => {
                    star.update(tick);
                    star.draw(skyCtx);
                });

                // Random rare shooting star trigger (~every 350-500 frames)
                if (!shootingStar.active && Math.random() < 0.003) {
                    shootingStar.spawn();
                }
                shootingStar.update();
                shootingStar.draw(skyCtx);

                // 3. RENDER GROUND HILLS & GRADIENTS
                groundHills.forEach((hill, index) => {
                    gardenCtx.save();
                    const hillGrad = gardenCtx.createLinearGradient(0, hill.yOffset - hill.amplitude, 0, height);
                    hillGrad.addColorStop(0, hill.colorStart);
                    hillGrad.addColorStop(1, hill.colorEnd);

                    gardenCtx.fillStyle = hillGrad;
                    gardenCtx.beginPath();
                    gardenCtx.moveTo(0, height);

                    for (let x = 0; x <= width; x += 15) {
                        const y = getGroundY(x, index);
                        gardenCtx.lineTo(x, y);
                    }

                    gardenCtx.lineTo(width, height);
                    gardenCtx.closePath();
                    gardenCtx.fill();
                    gardenCtx.restore();
                });

                // 4. RENDER GRASS BLADES
                grassBlades.forEach(blade => {
                    blade.draw(gardenCtx, tick, CONFIG.windStrength);
                });

                // 5. RENDER BLOOMING FLOWERS
                flowers.forEach(flower => {
                    flower.update(tick);
                    flower.draw(gardenCtx, tick, CONFIG.windStrength);
                });

                // 6. RENDER AMBIENT DUST PARTICLES & FIREFLIES
                pollenParticles.forEach(particle => {
                    particle.update();
                    particle.draw(particleCtx);
                });

                fireflies.forEach(firefly => {
                    firefly.update(tick);
                    firefly.draw(particleCtx);
                });

                // Request next frame
                animationFrameId = requestAnimationFrame(renderScene);
            }

            function init() {
                resizeCanvases();
                initClouds();
                generateGrass();
                generateInitialFlowers();
                
                // Kick off 60 FPS loop
                animationFrameId = requestAnimationFrame(renderScene);
            }

            init();
        });
    </script>
</body>
